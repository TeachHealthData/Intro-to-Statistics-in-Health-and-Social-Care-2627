  type: website
  output-dir: _site
  render:
    - index.qmd
    - course-guide.qmd
    - resources.qmd
    #- R_Toolkit/index.qmd
    #- R_Toolkit/assessment-analysis.qmd
    #- R_Toolkit/cheat-sheet.qmd
    #- R_Toolkit/reading-code.qmd
